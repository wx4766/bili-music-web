<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>B站音乐 · 随身听 — Draft B (Benchmark: Apple Music)</title>
<style>
/* ============================================================
   Draft B · 现实标杆迁移：Apple Music (iOS 17 原生音乐 App)
   迁移骨架：大标题导航 / iOS 搜索框 / 56px 封面行列表
             毛玻璃迷你条 / 全屏 Now Playing(大封面+逐行歌词)
   B站基因：粉 #FB7299 主 accent(替代 Apple Music 红)
            蓝 #23ADE5 用于"无损/Hi-Res"徽标
            播放数(万)·时长徽标·UP主·弹幕母题
   ============================================================ */
:root{
  --bg:#0A0A0C;
  --bg-elev:#141416;
  --hairline:rgba(255,255,255,.08);
  --text-hi:#F5F5F7;
  --text-2:#98989F;   /* 对比黑底 ≈7:1 */
  --text-3:#8E8E93;
  --pink:#FB7299;
  --pink-press:#E05C84;
  --blue:#23ADE5;
  --blur-bg:rgba(24,24,27,.68);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:var(--text-hi);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
/* —— 手机画布：390×844 基准 —— */
.app{
  position:relative;width:390px;max-width:100vw;height:844px;max-height:100vh;
  background:var(--bg);overflow:hidden;
}
@media (max-width:420px){.app{width:100vw;height:100vh;max-height:none}}

/* ================= 视图 1：主列表 ================= */
.main{
  position:absolute;inset:0;overflow-y:auto;
  padding-bottom:calc(96px + var(--safe-b));
  scrollbar-width:none;
}
.main::-webkit-scrollbar{display:none}

/* 顶部状态栏区（standalone PWA 示意） */
.statusbar{
  height:44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 24px 4px;font-size:14px;font-weight:600;color:var(--text-hi);
}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sig{display:inline-flex;gap:2px;align-items:flex-end}
.sig i{width:3px;background:var(--text-hi);border-radius:1px;display:block}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}
.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:10px}
.batt{width:24px;height:12px;border:1px solid rgba(255,255,255,.5);border-radius:3px;padding:1.5px;position:relative}
.batt::before{content:"";display:block;height:100%;width:72%;background:var(--text-hi);border-radius:1.5px}
.batt::after{content:"";position:absolute;right:-3px;top:3px;width:1.5px;height:4px;background:rgba(255,255,255,.5);border-radius:0 1px 1px 0}

/* 品牌区 + 大标题（Apple Music: large title 34px bold） */
.hero{padding:2px 20px 0}
.hero .nas{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--blue);letter-spacing:.02em;
}
.hero .nas .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
h1.large{
  font-size:33px;font-weight:800;letter-spacing:-.6px;line-height:1.15;
  margin-top:6px;color:var(--text-hi);
}
h1.large .bili{color:var(--pink)}
.hero .sub{margin-top:4px;font-size:13px;color:var(--text-2)}

/* iOS 搜索框 */
.search-wrap{position:sticky;top:0;z-index:10;
  padding:10px 20px 10px;
  background:linear-gradient(to bottom,var(--bg) 78%,rgba(10,10,12,0));
}
.search{
  display:flex;align-items:center;gap:7px;
  height:38px;padding:0 12px;border-radius:11px;
  background:#1C1C1E;color:var(--text-3);font-size:16px;
  border:1px solid var(--hairline);
}
.search svg{flex:none}
.search input{
  flex:1;border:0;outline:0;background:transparent;color:var(--text-hi);
  font-size:16px;font-family:inherit;
}
.search input::placeholder{color:var(--text-3)}
.cancel{font-size:16px;color:var(--pink);font-weight:400;margin-left:2px}

/* 结果区段头（Apple Music 式编辑排版） */
.section-head{display:flex;align-items:baseline;justify-content:space-between;padding:14px 20px 6px}
.section-head h2{font-size:21px;font-weight:800;letter-spacing:-.3px}
.section-head .cnt{font-size:13px;color:var(--text-2)}

/* 列表行：56px 封面 + 单行标题（Apple Music 曲目行骨架） */
.rows{list-style:none}
.row{
  display:flex;align-items:center;gap:12px;
  padding:8px 20px;min-height:72px;cursor:pointer;
}
.row:active{background:rgba(255,255,255,.05)}
.art{
  width:56px;height:56px;border-radius:6px;flex:none;
  object-fit:cover;background:#1C1C1E;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
.art-wrap{position:relative;flex:none;width:56px;height:56px}
.art-wrap .dur{
  position:absolute;right:3px;bottom:3px;
  font-size:11px;font-weight:600;color:#fff;
  background:rgba(0,0,0,.72);padding:1px 5px;border-radius:4px;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
}
.row-txt{flex:1;min-width:0}
.row-txt .t{
  font-size:16px;font-weight:600;line-height:1.3;color:var(--text-hi);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-txt .m{
  margin-top:3px;font-size:13px;color:var(--text-2);
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;
}
.row-txt .m .up{flex:none;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.row-txt .m .sep{flex:none;color:#55555C}
.row-txt .m .pc{flex:none;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.row-txt .m .pc svg{flex:none}
/* Hi-Res 徽标（蓝，B站基因的克制用法） */
.hires{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.4px;
  color:#04121A;background:var(--blue);
  padding:2px 5px;border-radius:4px;line-height:1.2;
}
/* 正在播放行：粉色标题 + 均衡器动画（Apple Music 等化线母题） */
.row.playing .t{color:var(--pink)}
.eq{flex:none;display:flex;align-items:flex-end;gap:2px;height:16px;width:16px}
.eq i{flex:1;background:var(--pink);border-radius:1px;animation:eqb 1s ease-in-out infinite}
.eq i:nth-child(1){animation-delay:0s}.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eqb{0%,100%{height:4px}50%{height:16px}}
/* 每行右侧队列按钮，44px 触控 */
.row-btn{
  flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--text-3);border:0;background:none;cursor:pointer;
}
.rows-hairline{height:1px;background:var(--hairline);margin:0 20px}

/* ================= 迷你播放条：毛玻璃（iOS Music 风格） ================= */
.mini{
  position:absolute;left:8px;right:8px;
  bottom:calc(10px + var(--safe-b));z-index:20;
  display:flex;align-items:center;gap:10px;
  height:64px;padding:0 8px 0 6px;border-radius:14px;
  background:var(--blur-bg);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  cursor:pointer;
}
.mini .mart{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.mini .mtxt{flex:1;min-width:0}
.mini .mt1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt2{font-size:12px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mctrl{display:flex;align-items:center;gap:2px}
.icon-btn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--text-hi);cursor:pointer;border-radius:50%;
}
.icon-btn:active{opacity:.55}
.icon-btn.pink{color:var(--pink)}
/* 进度细线贴在迷你条底部 */
.mini .track{
  position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:1px;
  background:rgba(255,255,255,.16);
}
.mini .track i{position:absolute;left:0;top:0;bottom:0;width:34%;background:var(--pink);border-radius:1px}

/* ================= 视图 3：歌词全屏面板 ================= */
.np{
  position:absolute;inset:0;z-index:30;background:var(--bg);
  transform:translateY(103%);transition:transform .42s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;
}
.np.open{transform:translateY(0)}
/* 顶部抓取把手 + 收起（Apple Music 同款布局） */
.np-top{
  display:flex;align-items:center;justify-content:center;position:relative;
  padding:calc(14px + 8px) 16px 10px;flex:none;
}
.np-top .grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.np-top .close{
  position:absolute;right:12px;top:calc(14px + 4px);
}
/* 弹幕母题：Now Playing 顶部飘过的评论（B站基因） */
.danmu{position:absolute;left:0;right:0;top:64px;height:36px;overflow:hidden;pointer-events:none}
.danmu span{
  position:absolute;white-space:nowrap;font-size:12px;font-weight:600;
  color:rgba(255,255,255,.38);animation:dm 14s linear infinite;
}
.danmu span:nth-child(1){top:2px;animation-delay:0s}
.danmu span:nth-child(2){top:20px;animation-delay:-6s;color:rgba(35,173,229,.42)}
.danmu span:nth-child(3){top:8px;animation-delay:-11s}
@keyframes dm{from{transform:translateX(390px)}to{transform:translateX(-260px)}}

.np-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 24px}
.np-cover{
  width:min(268px,62vw);aspect-ratio:1;border-radius:12px;object-fit:cover;
  margin:14px auto 0;background:#1C1C1E;
  box-shadow:0 18px 48px rgba(0,0,0,.65),0 4px 14px rgba(0,0,0,.5);
}
.np-meta{margin-top:22px;display:flex;align-items:center;gap:12px}
.np-meta .tt{flex:1;min-width:0}
.np-meta .tt h3{
  font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.np-meta .tt p{margin-top:3px;font-size:14px;color:var(--text-2)}
.np-meta .fav{color:var(--pink)}
/* 歌词滚动区：高亮当前行（Apple Music 歌词骨架） */
.lyrics{
  flex:1;min-height:0;overflow-y:auto;margin:20px -24px 0;padding:8px 24px;
  scrollbar-width:none;mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 88%,transparent 100%);
}
.lyrics::-webkit-scrollbar{display:none}
.lyr{
  font-size:17px;font-weight:700;line-height:1.5;color:var(--text-2);
  margin:14px 0;transition:color .3s,transform .3s;
}
.lyr.cur{color:var(--text-hi);font-size:20px;transform:translateX(2px)}
/* 控制区 */
.np-ctrl{flex:none;padding:10px 0 calc(18px + var(--safe-b))}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.16);position:relative;cursor:pointer}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;width:34%;background:var(--pink);border-radius:2px}
.prog .bar b{position:absolute;left:34%;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.np-btns{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.np-btns .big{width:64px;height:64px}
.np-btns .side{width:56px;height:56px}
.np-sub{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:14px}
.np-sub .icon-btn{width:44px;height:40px;color:var(--text-2)}
.np-sub .icon-btn.on{color:var(--pink)}
.np-up{
  display:flex;align-items:center;gap:6px;justify-content:center;
  margin-top:6px;font-size:12px;color:var(--text-2);
}
.np-up b{color:var(--blue);font-weight:600}

/* iOS 触感：所有可点按钮 44px 触控底线已满足 */
button{font-family:inherit}
</style>
</head>
<body>
<div class="app">

  <!-- ==================== 主列表视图 ==================== -->
  <div class="main" id="main">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="sb-r">
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="batt"></span>
      </span>
    </div>

    <header class="hero">
      <span class="nas"><span class="dot"></span>NAS 已连接 · home-server</span>
      <h1 class="large">随身听 <span class="bili">音乐馆</span></h1>
      <p class="sub">从 B 站抠回来的声音，都在这里</p>
    </header>

    <div class="search-wrap">
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5.2"/><path d="M11.5 11.5 15 15"/></svg>
        <input type="search" placeholder="音乐、UP主、关键词" aria-label="搜索">
        <span class="cancel">取消</span>
      </div>
    </div>

    <div class="section-head">
      <h2>搜索结果</h2>
      <span class="cnt">"晴天" · 6 条结果</span>

    <ul class="rows" id="rows"><!-- JS 渲染 --></ul>
  </div>

  <!-- ==================== 迷你播放条（毛玻璃） ==================== -->
  <div class="mini" id="mini" role="button" aria-label="展开播放器" tabindex="0">
    <img class="mart" id="mini-art" src="" alt="">
    <div class="mtxt">
      <div class="mt1" id="mini-t"></div>
      <div class="mt2" id="mini-a"></div>
    </div>
    <div class="mctrl">
      <button class="icon-btn" aria-label="上一首" onclick="event.stopPropagation()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M5 4h2v12H5zM16 4.8v10.4a.7.7 0 0 1-1.1.55L8.4 10.5a.62.62 0 0 1 0-1L14.9 4.25A.7.7 0 0 1 16 4.8z"/></svg>
      </button>
      <button class="icon-btn" id="mini-play" aria-label="播放/暂停">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor" id="mini-play-ic"><path d="M7 4.3v13.4a.7.7 0 0 0 1.06.6l10.2-6.7a.7.7 0 0 0 0-1.2L8.06 3.7A.7.7 0 0 0 7 4.3z"/></svg>
      </button>
      <button class="icon-btn" aria-label="下一首" onclick="event.stopPropagation()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M13 4h2v12h-2zM4 4.8v10.4a.7.7 0 0 0 1.1.55l6.5-5.25a.62.62 0 0 0 0-1L5.1 4.25A.7.7 0 0 0 4 4.8z"/></svg>
      </button>
    </div>
    <div class="track"><i></i></div>
  </div>

  <!-- ==================== 歌词全屏面板 ==================== -->
  <div class="np" id="np">
    <div class="np-top">
      <span class="grab"></span>
      <button class="icon-btn close" id="np-close" aria-label="收起">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7l5 5 5-5"/></svg>
      </button>
    </div>
    <div class="danmu" aria-hidden="true">
      <span>前排！无损音质真的顶</span>
      <span>4K 修复党狂喜</span>
      <span>单 NAS 循环了一下午</span>
    </div>

    <div class="np-body">
      <img class="np-cover" id="np-art" src="" alt="正在播放封面">
      <div class="np-meta">
        <div class="tt">
          <h3 id="np-t"></h3>
          <p id="np-a"></p>
        </div>
        <button class="icon-btn fav" aria-label="收藏">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="currentColor"><path d="M14 24.2S4.5 18.6 4.5 11.7c0-3.4 2.6-6 5.8-6 2 0 3.2 1 3.7 2 .5-1 1.7-2 3.7-2 3.2 0 5.8 2.6 5.8 6 0 6.9-9.5 12.5-9.5 12.5z"/></svg>
        </button>
      </div>

      <div class="lyrics" id="lyrics"><!-- JS 渲染 --></div>

      <div class="np-ctrl">
        <div class="prog">
          <span id="t-cur">1:32</span>
          <div class="bar"><i></i><b></b></div>
          <span id="t-dur">-4:30</span>
        </div>
        <div class="np-btns">
          <button class="icon-btn side" aria-label="上一首">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="currentColor"><path d="M6 5h2.4v16H6zM21 5.9v14.2a.9.9 0 0 1-1.4.75L10 13.7a.83.83 0 0 1 0-1.4l9.6-7.15A.9.9 0 0 1 21 5.9z"/></svg>
          </button>
          <button class="icon-btn big" id="np-play" aria-label="播放/暂停">
            <svg width="42" height="42" viewBox="0 0 42 42" fill="currentColor" id="np-play-ic"><path d="M13 7.8v26.4a1.4 1.4 0 0 0 2.1 1.2l19.6-13.2a1.4 1.4 0 0 0 0-2.4L15.1 6.6A1.4 1.4 0 0 0 13 7.8z"/></svg>
          </button>
          <button class="icon-btn side" aria-label="下一首">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="currentColor"><path d="M17.6 5H20v16h-2.4zM5 5.9v14.2a.9.9 0 0 0 1.4.75l9.6-7.15a.83.83 0 0 0 0-1.4L6.4 5.15A.9.9 0 0 0 5 5.9z"/></svg>
          </button>
        </div>
        <div class="np-sub">
          <button class="icon-btn" aria-label="弹幕开关" style="color:var(--blue)">
            <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 9.5c0 3.3-2.9 6-6.5 6-.9 0-1.8-.2-2.6-.5L3 16.5l1-3.1A5.7 5.7 0 0 1 3 9.5c0-3.3 2.9-6 6.5-6S16 6.2 16 9.5z"/><path d="M6.5 9.5h.01M9.5 9.5h.01M12.5 9.5h.01"/></svg>

          </button>
          <button class="icon-btn" aria-label="播放队列">
            <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5.5h9M3 9.5h9M3 13.5h5"/><circle cx="14.5" cy="13" r="2.5"/><path d="M17 13V6l-3 1.2"/></svg>
          </button>
        </div>
        <div class="np-up">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="3.4" r="2.1"/><path d="M1.6 10.8c.4-2.2 2.3-3.4 4.4-3.4s4 1.2 4.4 3.4z"/></svg>
          来源投稿 · UP主 <b id="np-up"></b>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ 真实数据（mockdata.json，6 条） ============ */
const DATA=[
{title:"【𝐇𝐢-𝐑𝐞𝐬无损音质】｜《晴天》- 周杰伦 -'故事的小黄花'",author:"VV音乐局",pic:"https://i0.hdslb.com/bfs/archive/b72e06e408b1636bb9ca8df55a171e44d6ba1702.jpg",duration:270,play:3069040,hires:1},
{title:"【4K修复】周杰伦 - 晴天MV 2160P修复版",author:"zyl2012_音乐无限",pic:"https://i1.hdslb.com/bfs/archive/6770f3a7d60f21469194251726588cee3b8bdb45.jpg",duration:317,play:17549049,hires:0},
{title:"【周杰伦•晴天•超长尾奏•原始版】2022年8月29日，B站独家上线《周杰伦限定珍藏Demo访谈VCR》，官方首次放出《晴天》原始草稿Demo",author:"斩月白霞Bleach",pic:"https://i0.hdslb.com/bfs/archive/a9f390d5a7fa73bc8412a5aa4c9f0db2340a9ad2.jpg",duration:72,play:131,hires:0},
{title:"周杰伦——《晴天》",author:"寻意zzzz",pic:"https://i1.hdslb.com/bfs/archive/6190f20921a6f9c09f7992f183285961dd421bcc.jpg",duration:267,play:495047,hires:0},
{title:"【4K Hi-Res】晴天-周杰伦",author:"如歌如梦",pic:"https://i1.hdslb.com/bfs/archive/7cd9aeaeaa0bf2341551463ca90e8e47cbff0a62.jpg",duration:270,play:1046629,hires:1},
{title:"【𝐇𝐢-𝐑𝐞𝐬·无损音质】《晴天》-周杰伦-“故事的小黄花，从出生那年就飘着”",author:"维登音乐",pic:"https://i2.hdslb.com/bfs/archive/9bba542099bea7212a4c56bec7aab72698ed9179.jpg",duration:270,play:15751,hires:1}
];
/* 注：第 6 条标题中的引号已替换为中文弯引号，避免与 JS 字面量冲突 */

const CUR=0; // 《晴天》正在播放
const fmt=n=>n>=1e8?(n/1e8).toFixed(1)+"亿":n>=1e4?(n/1e4).toFixed(1)+"万":String(n);
const mmss=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

/* ============ 渲染列表 ============ */
const playIc='<svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><path d="M2.5 1.6v7.8a.5.5 0 0 0 .77.42l6-3.9a.5.5 0 0 0 0-.84l-6-3.9a.5.5 0 0 0-.77.42z"/></svg>';
const rowsEl=document.getElementById("rows");
rowsEl.innerHTML=DATA.map((d,i)=>{
  const playing=i===CUR;
  return `<li class="row ${playing?"playing":""}">
    <div class="art-wrap">
      <img class="art" src="${d.pic}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="dur">${mmss(d.duration)}</span>
    </div>
    <div class="row-txt">
      <div class="t">${d.title}</div>
      <div class="m">
        <span class="up">${d.author}</span><span class="sep">·</span>
        <span class="pc">${playIc}${fmt(d.play)}</span>
      </div>
    </div>
    ${d.hires?'<span class="hires">Hi-Res</span>':""}
    ${playing?'<span class="eq"><i></i><i></i><i></i></span>':""}
    <button class="row-btn" aria-label="更多操作">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="2.5" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13.5" r="1.4"/></svg>
    </button>
  </li>`;
}).join("");

/* ============ 迷你条 / 全屏面板数据 ============ */
const cur=DATA[CUR];
const cleanTitle=t=>t.replace(/^【[^】]*】[｜|•]?\s*/,"").replace(/^【[^】]*】/,"").trim()||t;
document.getElementById("mini-art").src=cur.pic;
document.getElementById("mini-t").textContent=cleanTitle(cur.title);
document.getElementById("mini-a").textContent=cur.author;
document.getElementById("np-art").src=cur.pic;
document.getElementById("np-t").textContent=cleanTitle(cur.title);
document.getElementById("np-a").textContent=cur.author;
document.getElementById("np-up").textContent=cur.author;
document.getElementById("t-dur").textContent="-"+mmss(cur.duration);

/* ============ 歌词（演示用原创占位词，非原曲歌词） ============ */
const LYR=[
"窗台的光 睡到一半的下午",
"风把旧磁带 翻了一页又一页",
"你说时间 是不会回头的水",
"可我总想在某个转角 遇见从前",
"云朵慢慢走 教室后排的钟",
"谁在黑板角落 画了一片天空",
"后来我们都 学会了说再见",
"只是那首歌 一响就想起了夏天",
"如果还能回到那个下午",
"我想把每句没说完的话 说完"
];
const lyrEl=document.getElementById("lyrics");
lyrEl.innerHTML=LYR.map((l,i)=>`<div class="lyr ${i===3?"cur":""}">${l}</div>`).join("");

/* ============ 展开 / 收起 + 播放按钮（最简交互） ============ */
const np=document.getElementById("np");
const open=()=>{np.classList.add("open");setTimeout(()=>lyrEl.scrollTop=lyrEl.querySelector(".cur").offsetTop-lyrEl.offsetTop-60,460);};
const close=()=>np.classList.remove("open");
document.getElementById("mini").addEventListener("click",open);
document.getElementById("mini").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
document.getElementById("np-close").addEventListener("click",close);
/* 支持 #np 直达歌词态（截图/调试用） */
if(location.hash==="#np")np.classList.add("open");

/* 播放/暂停切换（播放↔暂停图标） */
const PLAY='<path d="M7 4.3v13.4a.7.7 0 0 0 1.06.6l10.2-6.7a.7.7 0 0 0 0-1.2L8.06 3.7A.7.7 0 0 0 7 4.3z"/>';
const PAUSE='<path d="M6 4h3.4v14H6zM12.6 4H16v14h-3.4z"/>';
let playing=true;
function togglePlay(){
  playing=!playing;
  document.getElementById("mini-play-ic").innerHTML=playing?PAUSE:PLAY;
  document.getElementById("np-play-ic").innerHTML=playing
    ?'<path d="M13 7.8v26.4a1.4 1.4 0 0 0 2.1 1.2l19.6-13.2a1.4 1.4 0 0 0 0-2.4L15.1 6.6A1.4 1.4 0 0 0 13 7.8z"/>'
    :'<path d="M11 7h6.6v28H11zM24.4 7H31v28h-6.6z"/>';
}
document.getElementById("mini-play").addEventListener("click",e=>{e.stopPropagation();togglePlay();});
document.getElementById("np-play").addEventListener("click",togglePlay);
</script>
</body>
</html>
