<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>B站音乐 · 随身听 BM-01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BILI-MUSIC PERSONAL UNIT  BM-01
   Design philosophy: Teenage Engineering —
   hardware audio instrument, silkscreen labels, mono type,
   one precise accent. Less, but engineered.
   ============================================================ */
:root{
  --bg:        #101113;
  --panel:     #16181b;
  --panel-2:   #1b1e22;
  --line:      #26292e;
  --line-soft: #202329;
  --ink:       #eceae4;   /* primary text */
  --sub:       #a7acb4;   /* secondary    */
  --dim:       #7d838c;   /* silkscreen labels, 12px+ */
  --pink:      #fb7299;   /* bilibili pink — PLAYING accent */
  --pink-dim:  rgba(251,114,153,.14);
  --blue:      #23ade5;   /* bilibili blue — NAS link LED only */
  --sans: "Noto Sans SC","PingFang SC","Helvetica Neue",sans-serif;
  --mono: "IBM Plex Mono","SF Mono",ui-monospace,monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#0a0b0c}
body{
  font-family:var(--sans);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  display:flex;justify-content:center;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}

/* ---------- the unit ---------- */
.app{
  position:relative;
  width:100%;max-width:390px;
  min-height:100dvh;
  background:var(--bg);
  overflow:hidden;
}

/* ---------- top calibration ruler (signature) ---------- */
.ruler{
  height:18px;
  background:
    repeating-linear-gradient(90deg,
      var(--line) 0 1px, transparent 1px 12px),
    linear-gradient(var(--bg),var(--bg));
  background-size:auto 9px, auto;
  background-position:left bottom, 0 0;
  background-repeat:repeat-x, no-repeat;
  border-bottom:1px solid var(--line);
  position:relative;
}
.ruler::after{ /* major ticks every 60px, taller */
  content:"";
  position:absolute;inset:auto 0 0 0;height:13px;
  background:repeating-linear-gradient(90deg,
    #3a3e45 0 1px, transparent 1px 60px);
  background-size:auto 100%;
  background-repeat:repeat-x;
}
.ruler .unit-no{
  position:absolute;top:1px;right:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  color:var(--dim);
}
.ruler .unit-no b{color:var(--sub);font-weight:500}

/* ---------- header ---------- */
header{padding:14px 16px 0}
.sysline{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  color:var(--dim);text-transform:uppercase;
}
.led{
  width:6px;height:6px;background:var(--blue);
  border-radius:1px;
  box-shadow:0 0 6px rgba(35,173,229,.8);
  animation:led 2.4s steps(2) infinite;
}
@keyframes led{50%{opacity:.35}}
.sysline .spacer{flex:1}
.brandrow{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}
.brandrow h1{font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1.2}
.brandrow .model{
  font-family:var(--mono);font-size:11px;color:var(--dim);
  letter-spacing:.1em;
}
.tagline{
  font-size:12px;color:var(--dim);letter-spacing:.05em;
  margin-bottom:16px;
}
.tagline em{font-style:normal;color:var(--sub)}

/* ---------- search ---------- */
.search{
  display:flex;align-items:center;gap:10px;
  height:46px;
  background:var(--panel);
  border:1px solid var(--line);
  padding:0 12px;
  margin-bottom:6px;
}
.search svg{flex:none;stroke:var(--dim)}
.search input{
  flex:1;background:none;border:0;outline:0;
  color:var(--ink);font:15px var(--sans);letter-spacing:.02em;
}
.search input::placeholder{color:var(--dim)}
.search .key{
  font-family:var(--mono);font-size:10px;color:var(--dim);
  border:1px solid var(--line);padding:2px 6px;letter-spacing:.1em;
}
.seclabel{
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  color:var(--dim);text-transform:uppercase;
  padding:14px 2px 10px;
}
.seclabel::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.seclabel .n{color:var(--sub)}

/* ---------- track list : channels ---------- */
main{padding:0 16px 140px}
.tracks{list-style:none}
.trk{
  display:grid;
  grid-template-columns:34px 52px 1fr auto;
  gap:12px;align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--line-soft);
}
.trk:last-child{border-bottom:0}
.idx{
  font-family:var(--mono);font-size:13px;font-weight:500;
  color:var(--dim);letter-spacing:.04em;
}
.thumb{
  position:relative;width:52px;height:52px;flex:none;
  background:var(--panel-2);overflow:hidden;
}
.thumb img{
  width:100%;height:100%;object-fit:cover;
  filter:saturate(.92) contrast(1.05);
}
.thumb::after{ /* CRT scanlines — the grain motif */
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  pointer-events:none;
}
.meta{min-width:0}
.meta .t{
  font-size:14px;font-weight:500;line-height:1.42;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.meta .a{
  margin-top:3px;font-size:12px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meta .stats{
  margin-top:4px;display:flex;gap:10px;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--dim);
  letter-spacing:.04em;
}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dur{
  font-family:var(--mono);font-size:11px;color:var(--sub);
  border:1px solid var(--line);padding:1px 6px;
  letter-spacing:.06em;
}

/* playing channel state */
.trk.on{position:relative}
.trk.on::before{
  content:"";position:absolute;left:-16px;top:0;bottom:0;width:2px;
  background:var(--pink);
}
.trk.on .idx{color:var(--pink)}
.trk.on .meta .t{color:var(--ink)}
.eq{
  display:inline-flex;align-items:flex-end;gap:2px;height:12px;
  margin-right:6px;vertical-align:-1px;
}
.eq i{width:3px;background:var(--pink);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}
.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
.nowtag{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--pink);border:1px solid rgba(251,114,153,.45);
  padding:1px 6px;
  animation:blink 2s steps(2) infinite;
}
@keyframes blink{50%{opacity:.45}}

/* ---------- mini player : transport strip ---------- */
.mini{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:390px;z-index:20;
  background:rgba(22,24,27,.92);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + var(--safe-b));
}
.mini .progress{
  height:14px;margin:-16px 0 8px;position:relative;cursor:pointer;
  display:flex;align-items:center;
}
.mini .progress .rail{
  width:100%;height:2px;background:var(--line);position:relative;
}
.mini .progress .fill{
  position:absolute;left:0;top:0;bottom:0;background:var(--pink);
  width:32%;
}
.mini .progress .knob{
  position:absolute;top:50%;width:8px;height:8px;
  background:var(--pink);transform:translate(-50%,-50%);
  left:32%;
}
.minirow{display:flex;align-items:center;gap:12px}
.mini .thumb{width:44px;height:44px;cursor:pointer}
.mini .info{flex:1;min-width:0;cursor:pointer}
.mini .info .t{
  font-size:14px;font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.mini .info .a{
  font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px;
}
.mini .time{
  font-family:var(--mono);font-size:10px;color:var(--dim);
  letter-spacing:.06em;margin-top:3px;
}
.ctrls{display:flex;align-items:center;gap:4px;flex:none}
.cbtn{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);
}
.cbtn svg{stroke:var(--ink)}
.cbtn.play{
  background:var(--ink);
}
.cbtn.play svg{stroke:#101113}
.cbtn:active{opacity:.7}

/* ---------- lyrics panel : display mode ---------- */
.lyrics{
  position:fixed;inset:0;left:50%;transform:translate(-50%,102%);
  width:100%;max-width:390px;z-index:30;
  background:var(--bg);
  display:flex;flex-direction:column;
  transition:transform .42s cubic-bezier(.32,.72,.22,1);
}
body.open .lyrics{transform:translate(-50%,0)}
.ly-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;
  border-bottom:1px solid var(--line-soft);
}
.ly-head .tag{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  color:var(--dim);text-transform:uppercase;
}
.ly-head .tag b{color:var(--pink);font-weight:500}
.close{
  width:44px;height:44px;margin-right:-8px;
  display:flex;align-items:center;justify-content:center;
}
.ly-body{flex:1;overflow-y:auto;padding:22px 20px 10px;scrollbar-width:none}
.ly-body::-webkit-scrollbar{display:none}
.ly-cover{
  position:relative;width:168px;height:168px;margin:0 auto 6px;
  background:var(--panel-2);overflow:hidden;
}
.ly-cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.95)}
.ly-cover::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
}
.ly-cover .frame{
  position:absolute;inset:0;border:1px solid var(--line);
  pointer-events:none;
}
.ly-title{
  text-align:center;font-size:20px;font-weight:700;line-height:1.4;
  margin-top:14px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ly-sub{
  text-align:center;font-family:var(--mono);font-size:11px;
  color:var(--sub);letter-spacing:.08em;margin-top:6px;
}
.ly-sub .sep{color:var(--dim);margin:0 6px}
.ly-lines{margin-top:26px;padding-bottom:20px}
.ly{
  font-size:16px;line-height:1.6;color:var(--dim);
  padding:9px 0;text-align:center;
  transition:color .3s,transform .3s;
  transform-origin:center;
}
.ly .ts{
  display:block;font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;color:#565b63;margin-bottom:2px;
}
.ly.on{color:var(--ink);transform:scale(1.03)}
.ly.on .ts{color:var(--pink)}
.past{color:#5d636c}

/* transport deck */
.deck{
  border-top:1px solid var(--line);
  background:var(--panel);
  padding:14px 20px calc(16px + var(--safe-b));
}
.deck .progress{height:18px;display:flex;align-items:center;cursor:pointer;position:relative}
.deck .rail{
  width:100%;height:2px;background:var(--line);position:relative;
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,#101113 9px 10px);
}
.deck .fill{position:absolute;left:0;top:0;bottom:0;background:var(--pink);width:32%}
.deck .knob{
  position:absolute;top:50%;left:32%;width:10px;height:10px;
  background:var(--pink);transform:translate(-50%,-50%);
}
.deck .times{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:10px;color:var(--dim);
  letter-spacing:.08em;margin:4px 0 10px;
}
.deck .row{
  display:flex;align-items:center;justify-content:space-between;
}
.dbtn{
  width:56px;height:56px;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  background:var(--panel-2);
}
.dbtn svg{stroke:var(--ink)}
.dbtn:active{background:var(--line)}
.dbtn.big{
  width:72px;height:72px;background:var(--ink);border-color:var(--ink);
}
.dbtn.big svg{stroke:#101113}
.heart.on svg{stroke:var(--pink);fill:var(--pink);fill-opacity:.25}
.deck .brandline{
  text-align:center;margin-top:12px;
  font-family:var(--mono);font-size:9px;letter-spacing:.3em;
  color:#4d525a;text-transform:uppercase;
}
</style>
</head>
<body>
<div class="app">

  <!-- calibration ruler -->
  <div class="ruler"><span class="unit-no">UNIT <b>BM-01</b></span></div>

  <header>
    <div class="sysline">
      <span class="led"></span> NAS LINK
      <span class="spacer"></span>
      <span>SYNC 09:27</span>

      <span class="model">BILI-MUSIC / CH-06</span>

    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.5">
        <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>
      </svg>
      <input type="text" placeholder="搜索 B 站音频投稿" aria-label="搜索">
      <span class="key">GO</span>
    </div>

  <main>
    <div class="seclabel"><span>SEARCH RESULT</span><span class="n" id="count">—</span></div>

          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- lyrics display mode -->
  <section class="lyrics" id="lyrics" aria-label="歌词面板">
    <div class="ly-head">
      <span class="tag">NOW PLAYING · <b id="lyCh">CH 01</b></span>
      <button class="close" id="close" aria-label="收起">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#a7acb4" stroke-width="1.6">
          <path d="M4 11l5-5 5 5"/>
        </svg>
      </button>
    </div>
    <div class="ly-body" id="lyBody">
      <div class="ly-cover">
        <img id="lyPic" src="" alt="">
        <div class="frame"></div>
      </div>
      <div class="ly-title" id="lyTitle">—</div>
      <div class="ly-sub">
        <span id="lyAuthor">—</span><span class="sep">/</span>
        <span id="lyDur">0:00</span><span class="sep">/</span>
        <span id="lyPlay">—</span>
      </div>
      <div class="ly-lines" id="lyLines"></div>
    </div>
    <div class="deck">
      <div class="progress" id="dkBar">
        <div class="rail"><div class="fill" id="dFill"></div></div>
        <div class="knob" id="dKnob"></div>
      </div>
      <div class="times"><span id="dCur">0:00</span><span id="dDur">0:00</span></div>
      <div class="row">
        <button class="dbtn heart" id="fav" aria-label="收藏">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke-width="1.6">
            <path d="M11 18.5S3.5 14 3.5 8.6C3.5 6 5.6 4 8 4c1.3 0 2.4.6 3 1.6C11.6 4.6 12.7 4 14 4c2.4 0 4.5 2 4.5 4.6C18.5 14 11 18.5 11 18.5z"/>
          </svg>
        </button>
        <button class="dbtn" id="dPrev" aria-label="上一首">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke-width="1.6">
            <path d="M13 3v12L5.5 9z" fill="currentColor" stroke="none"/><path d="M4.5 3.5v11"/>
          </svg>
        </button>
        <button class="dbtn big" id="dPlay" aria-label="播放/暂停">
          <svg id="dPlayIcon" width="26" height="26" viewBox="0 0 18 18" fill="none" stroke-width="1.8"></svg>
        </button>
        <button class="dbtn" id="dNext" aria-label="下一首">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke-width="1.6">
            <path d="M5 3v12l7.5-6z" fill="currentColor" stroke="none"/><path d="M13.5 3.5v11"/>
          </svg>
        </button>
        <button class="dbtn" id="queue" aria-label="队列">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.6">
            <path d="M4 6h12M4 10h12M4 14h7"/>
          </svg>
        </button>
      </div>
      <div class="brandline">BILI-MUSIC · PERSONAL NAS UNIT · BM-01</div>
    </div>
  </section>

</div>

 [200,"故事翻到最后一页"],
 [222,"结尾停在 没寄出的信"],
 [244,"如果重来 我还想遇见你"],
 [262,"在晴天 在雨里 都可以"]
];

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.floor(s));return (s/60|0)+":"+String(s%60).padStart(2,"0")};
const fmtPlay=n=>n>=1e4?(n/1e4).toFixed(n>=1e8?0:1).replace(/\.0$/,"")+"万":String(n);
const pad2=n=>String(n+1).padStart(2,"0");

let cur=0, playing=true, t=87, favOn=false, timer=null;

/* ---------- render : list ---------- */
function renderList(){
  $("count").textContent="N="+pad2(TRACKS.length-1);
  $("list").innerHTML=TRACKS.map((d,i)=>`
    <li class="trk${i===cur?" on":""}">
      <span class="idx">${pad2(i)}</span>
      <div class="thumb"><img src="${d.pic}" alt="" loading="lazy"></div>
      <div class="meta">
        <div class="t">${i===cur?'<span class="eq"><i></i><i></i><i></i></span>':""}${d.title}</div>
        <div class="a">${d.author}</div>
        <div class="stats"><span>PLAY ${fmtPlay(d.play)}</span></div>
      </div>
      <div class="side">
        <span class="dur">${fmt(d.duration)}</span>
        ${i===cur?'<span class="nowtag">PLAYING</span>':""}
      </div>
    </li>`).join("");
}

/* ---------- render : mini + lyrics header ---------- */
function renderNow(){
  const d=TRACKS[cur];
  $("mThumb").innerHTML=`<img src="${d.pic}" alt="">`;
  $("mTitle").textContent=d.title;
  $("mAuthor").textContent=d.author;
  $("mDur").textContent=fmt(d.duration);
  $("lyCh").textContent="CH "+pad2(cur);
  $("lyPic").src=d.pic;
  $("lyTitle").textContent=d.title;
  $("lyAuthor").textContent=d.author;
  $("lyDur").textContent=fmt(d.duration);
  $("lyPlay").textContent=fmtPlay(d.play)+" PLAYS";
  document.querySelectorAll(".trk").forEach((el,i)=>el.classList.toggle("on",i===cur));
  drawPlayIcon();
}

/* ---------- play icons (SVG, no emoji) ---------- */
const PLAY_D='<path d="M6 3.5v11l9-5.5z" fill="currentColor" stroke="none"/>';
const PAUSE_D='<path d="M6 4v10M12 4v10"/>';
function drawPlayIcon(){
  $("playIcon").innerHTML=playing?PAUSE_D:PLAY_D;
  $("dPlayIcon").innerHTML=playing?PAUSE_D:PLAY_D;
}

/* ---------- render : lyrics lines ---------- */
function renderLyrics(){
  $("lyLines").innerHTML=LYRICS.map(([ts,line])=>
    `<div class="ly" data-ts="${ts}"><span class="ts">${fmt(ts)}</span>${line}</div>`).join("");
}

/* ---------- transport : progress + lyric highlight ---------- */
function paintProgress(){
  const p=t/TRACKS[cur].duration;
  const pct=(Math.min(1,p)*100).toFixed(2)+"%";
  $("mFill").style.width=pct; $("mKnob").style.left=pct;
  $("dFill").style.width=pct; $("dKnob").style.left=pct;
  $("mCur").textContent=fmt(t); $("dCur").textContent=fmt(t);
}
function paintLyric(){
  let active=-1;
  LYRICS.forEach(([ts],i)=>{if(t>=ts)active=i});
  document.querySelectorAll(".ly").forEach((el,i)=>{
    el.classList.toggle("on",i===active);
    el.classList.toggle("past",active>-1&&i<active);
    if(i===active&&el.offsetTop)
      $("lyBody").scrollTo({top:$("lyBody").scrollTop+el.offsetTop-$("lyBody").offsetHeight*.42,behavior:"smooth"});
  });
}
function tick(){
  if(!playing)return;
  t++;
  if(t>=TRACKS[cur].duration){next(true)}
  paintProgress();paintLyric();
}
function startTimer(){clearInterval(timer);timer=setInterval(tick,1000)}
function seek(e){
  const r=e.currentTarget.getBoundingClientRect();
  t=Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*TRACKS[cur].duration);
  paintProgress();paintLyric();
}

/* ---------- track switching ---------- */
function next(auto){cur=(cur+1)%TRACKS.length;t=0;refresh()}
function prev(){cur=(cur-1+TRACKS.length)%TRACKS.length;t=0;refresh()}
function refresh(){renderNow();paintProgress();paintLyric()}

/* ---------- interactions ---------- */
$("mini").addEventListener("click",e=>{
  if(e.target.closest(".cbtn")||e.target.closest("#miniBar"))return;
  document.body.classList.add("open");
});
$("mInfo").addEventListener("click",()=>document.body.classList.add("open"));
$("close").addEventListener("click",()=>document.body.classList.remove("open"));
$("play").addEventListener("click",e=>{e.stopPropagation();playing=!playing;drawPlayIcon()});
$("dPlay").addEventListener("click",()=>{playing=!playing;drawPlayIcon()});
$("next").addEventListener("click",e=>{e.stopPropagation();next()});
$("prev").addEventListener("click",e=>{e.stopPropagation();prev()});
$("dNext").addEventListener("click",next);
$("dPrev").addEventListener("click",prev);
$("fav").addEventListener("click",function(){favOn=!favOn;this.classList.toggle("on",favOn)});
$("miniBar").addEventListener("click",seek);
$("dkBar").addEventListener("click",seek);

/* ---------- boot ---------- */
renderList();renderNow();renderLyrics();paintProgress();paintLyric();startTimer();
</script>
</body>
</html>
